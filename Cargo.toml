[package]
name = "amll-ttml-api"
version = "0.1.0"
edition = "2024"
license = "MIT OR Apache-2.0"
description = "AMLL TTML DataBase API 服务，提供 TTML 格式歌词的获取与搜索功能"
repository = "https://github.com/amll-dev/amll-ttml-api"
homepage = "https://github.com/amll-dev/amll-ttml-api"

[dependencies]
anyhow = "1.0"
arc-swap = "1.7"
async-lock = "3.4.2"
axum = "0.8.9"
compact_str = { version = "0.10.0", features = ["serde"] }
dotenvy = "0.15.7"
ferrous-opencc = { version = "0.4.0", default-features = false, features = [
    "t2s-conversion",
] }
futures = "0.3.33"
hex = "0.4"
hmac = "0.13"
moka = { version = "0.12", features = ["future"] }
reqwest = { version = "0.13", features = ["json", "default-tls"] }
sha2 = "0.11"
sea-orm = { version = "2.0.0", features = [
    "runtime-tokio-rustls",
    "sqlx-sqlite",
    "macros",
] }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0.150"
strsim = "0.11.1"
tempfile = "3.27.0"
tokio = { version = "1.38", features = ["full"] }
tower-http = { version = "0.7", features = ["cors", "trace"] }
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
sentry = { version = "0.49", default-features = false, features = [
    "anyhow",
    "backtrace",
    "contexts",
    "panic",
    "transport",
    "reqwest",
    "rustls",
    "sentry-tower",
    "tower",
] }
sentry-tracing = "0.49"
sentry-tower = { version = "0.49", features = ["http"] }
ttml_processor = "0.3.3"
url = "2.5.8"
zip = "8.6.0"

[lints.clippy]
pedantic = { level = "warn", priority = -1 }
nursery = { level = "warn", priority = -1 }

future_not_send = "allow"
missing_errors_doc = "allow"

cast_precision_loss = "allow"
cast_possible_truncation = "allow"

assert_is_empty = "allow"
