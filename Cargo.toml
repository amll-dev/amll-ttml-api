[package]
name = "amll-ttml-api"
version = "0.1.0"
edition = "2024"
license = "MIT OR Apache-2.0"
description = "AMLL TTML DataBase API 服务，提供 TTML 格式歌词的获取与搜索功能"
repository = "https://github.com/amll-dev/amll-ttml-api"
homepage = "https://github.com/amll-dev/amll-ttml-api"

[dependencies]
arc-swap = "1.7"
async-lock = "3.4.2"
axum = "0.8.9"
compact_str = { version = "0.10.0", features = ["serde"] }
ferrous-opencc = { version = "0.4.0", default-features = false, features = [
    "t2s-conversion",
] }
moka = { version = "0.12", features = ["future"] }
reqwest = { version = "0.13", features = ["json", "default-tls"] }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0.150"
strsim = "0.11.1"
tokio = { version = "1.38", features = ["full"] }
tower-http = { version = "0.7", features = ["cors", "trace"] }
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
url = "2.5.8"

[lints.clippy]
pedantic = { level = "warn", priority = -1 }
nursery = { level = "warn", priority = -1 }

future_not_send = "allow"
missing_errors_doc = "allow"

cast_precision_loss = "allow"
